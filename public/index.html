<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080712"><title>SuperNova Browser</title>
<style>
:root{color-scheme:dark;--bg:#080712;--panel:#11101d;--line:#29253e;--muted:#9792b5;--purple:#a78bfa;--pink:#e879f9;--text:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -35%,#3e1c72 0,#17102e 35%,var(--bg) 72%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:1500px;margin:auto;padding:25px 30px 30px}.top{display:flex;align-items:center;gap:13px;margin-bottom:20px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#c084fc,#6d28d9);box-shadow:0 0 32px #a855f755}.logo svg{width:27px;height:27px}.brand{font-size:21px;font-weight:750;letter-spacing:.02em}.tagline{font-size:12px;color:var(--muted);margin-top:1px}.toolbar{display:flex;align-items:center;gap:8px;background:#100e1bcf;border:1px solid #37304d;border-radius:15px;padding:9px;box-shadow:0 14px 45px #0005;backdrop-filter:blur(18px)}button,.address{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:10px;background:#171523;min-height:42px}.icon{width:42px;font-size:20px;cursor:pointer;color:#c4bddf}.icon:hover{border-color:#7652b7;background:#221b34}.address{flex:1;min-width:120px;padding:0 15px;background:#090812;border-color:#37304d;outline:none}.address:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a78bfa25}.go{padding:0 22px;border:0;background:linear-gradient(100deg,#7c3aed,#a855f7);font-weight:700;cursor:pointer;box-shadow:0 5px 18px #7c3aed33}.go:hover{filter:brightness(1.12)}.statusline{height:37px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;padding:0 5px}.status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{border:1px solid #342c49;border-radius:99px;padding:4px 9px;color:#b6a8d9;white-space:nowrap}main{position:relative;border:1px solid #302940;border-radius:16px;overflow:hidden;background:#0c0a14;box-shadow:0 22px 80px #0008}.viewer{display:block;width:100%;height:calc(100vh - 192px);min-height:440px;border:0;background:#fff}.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(ellipse at 50% 45%,#231438 0,#100d1c 57%,#090811 100%)}.empty.active{display:flex}.welcome h1{margin:0 0 6px;font-size:clamp(30px,5vw,54px);letter-spacing:-.04em}.welcome h1 span{color:#c084fc}.welcome p{color:#aaa4bf;margin:0}.orbit{height:92px;width:92px;border:1px solid #8555b780;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 0 40px #a855f733,inset 0 0 35px #a855f722;position:relative}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #a78bfa38;border-radius:50%;transform:rotate(-32deg)}.orbit:before{width:132px;height:42px}.orbit:after{width:165px;height:58px;transform:rotate(30deg)}.planet{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,#f0abfc,#7c3aed 65%,#32105f);box-shadow:0 0 28px #c084fc88}.foot{font-size:11px;color:#716c87;text-align:center;padding:12px}.foot a{color:#a78bfa;text-decoration:none}@media(max-width:700px){.shell{padding:15px 12px}.toolbar{gap:5px;padding:7px}.icon{width:36px}.go{padding:0 14px}.viewer{height:calc(100vh - 170px);min-height:350px}.tagline{display:none}.pill{display:none}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.7a9.3 9.3 0 1 0 9.3 9.3A9.3 9.3 0 0 0 12 2.7Z" stroke="white" stroke-width="1.5"/><path d="M15.6 7.1 13.7 13.7 7.1 15.6 9 9l6.6-1.9Z" fill="white"/><circle cx="12" cy="12" r="1.2" fill="#7c3aed"/></svg></div><div><div class="brand">SuperNova Browser</div><div class="tagline">Your window into the wider web</div></div></header>
<div class="toolbar" role="search"><button class="icon" id="back" title="Back" aria-label="Back">‹</button><button class="icon" id="forward" title="Forward" aria-label="Forward">›</button><button class="icon" id="reload" title="Reload" aria-label="Reload">↻</button><button class="icon" id="home" title="Home" aria-label="Home">⌂</button><input class="address" id="address" type="text" placeholder="Search DuckDuckGo or enter a website address" autocomplete="off" spellcheck="false" aria-label="Address or search"><button class="go" id="go">Go&nbsp; ↗</button></div>
<div class="statusline"><div class="status" id="status">Ready when you are</div><div class="pill">LOCAL PROXY · PRIVATE BY DEFAULT</div></div>
<main><div class="empty active" id="welcome"><div class="welcome"><div class="orbit"><div class="planet"></div></div><h1>Explore beyond <span>the event horizon.</span></h1><p>Search the web or enter a destination above.</p></div></div><iframe class="viewer" id="view" title="SuperNova website viewer" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox"></iframe></main>
<div class="foot">Websites may block embedded viewing or rely on features the proxy cannot reproduce. <a href="https://duckduckgo.com" target="_blank" rel="noreferrer">Search powered by DuckDuckGo</a></div>
</div><script>
const address=document.getElementById('address'),view=document.getElementById('view'),status=document.getElementById('status'),welcome=document.getElementById('welcome');
let historyList=[],historyIndex=-1,loadingTimer;
let proxyOrigin=`${location.protocol}//${location.hostname}:${Number(location.port||80)+1}`;
fetch('/config').then(response=>response.ok?response.json():null).then(config=>{if(config?.proxyOrigin)proxyOrigin=config.proxyOrigin}).catch(()=>{});
function normalize(input){input=input.trim();if(!input)return null;if(/^[a-z][a-z\d+.-]*:\/\//i.test(input)){try{const u=new URL(input);if(!['http:','https:'].includes(u.protocol))throw Error();return u.href}catch{return null}}if(/\s/.test(input)||!input.includes('.'))return 'https://duckduckgo.com/?q='+encodeURIComponent(input);if(!/^https?:\/\//i.test(input))input='https://'+input;try{const u=new URL(input);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function proxyUrl(target){return proxyOrigin+'/proxy?url='+encodeURIComponent(target)}
function navigate(input,save=true){const target=normalize(input);if(!target){status.textContent='Enter a valid website address or search phrase.';return}address.value=target;status.textContent='Opening '+target;welcome.classList.remove('active');clearTimeout(loadingTimer);loadingTimer=setTimeout(()=>{status.textContent='Still waiting. Some websites respond slowly or block proxy viewing.'},13000);view.src=proxyUrl(target);if(save){historyList=historyList.slice(0,historyIndex+1);historyList.push(target);historyIndex=historyList.length-1}}
document.getElementById('go').addEventListener('click',()=>navigate(address.value));address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate(address.value)});document.getElementById('home').addEventListener('click',()=>{welcome.classList.add('active');view.src='about:blank';address.value='';status.textContent='Ready when you are'});document.getElementById('reload').addEventListener('click',()=>{if(historyIndex>=0){status.textContent='Reloading…';view.src=proxyUrl(historyList[historyIndex])}});document.getElementById('back').addEventListener('click',()=>{if(historyIndex>0){historyIndex--;navigate(historyList[historyIndex],false)}});document.getElementById('forward').addEventListener('click',()=>{if(historyIndex<historyList.length-1){historyIndex++;navigate(historyList[historyIndex],false)}});view.addEventListener('load',()=>{clearTimeout(loadingTimer);if(view.src!=='about:blank')status.textContent='Page loaded · '+(historyList[historyIndex]||'');});
</script></body></html>
